name: Build catalog

on:
  schedule:
    - cron: "17 9 * * *"   # daily, after IMDb refreshes its datasets
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "ratings/**"        # the workflow's own cache commits

permissions:
  contents: write           # save the ratings cache back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never kill a run halfway through fetching ratings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build catalogs
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: python build.py --out dist --base-url "${{ steps.pages.outputs.base_url }}"
      - name: Save ratings cache
        run: |
          if [ ! -d ratings ]; then
            echo "No ratings cache yet (MDBLIST_API_KEY not set?)"
            exit 0
          fi
          git add ratings/
          if git diff --cached --quiet; then
            echo "Ratings cache unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ratings cache"
          git pull --rebase --autostash origin main && git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000    # ms; ~40k small catalog files can take over the default 10 min
